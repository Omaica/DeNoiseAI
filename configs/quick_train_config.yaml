# Quick Training Config - nho, nhanh, dung de build UI truoc
# Model rat nho, chay CPU ~10-15 phut, du de test giao dien
# Khi co model tot hon chi can thay file best_model.pth

audio:
  sample_rate: 16000
  segment_length: 2.0
  n_samples: 32000

stft:
  n_fft: 512
  hop_length: 256
  win_length: 512
  window: hann

model:
  name: dccrn
  encoder_channels: [8, 16, 32, 32, 64, 64]
  kernel_size: [5, 3]
  stride: [2, 1]
  lstm_hidden: 64
  lstm_layers: 1
  bidirectional: true
  use_attention: true
  masking_mode: "E"

training:
  batch_size: 4
  epochs: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  gradient_clip: 5.0
  scheduler:
    type: reduce_on_plateau
    factor: 0.5
    patience: 2
    min_lr: 0.00001
  early_stopping:
    patience: 10
    min_delta: 0.001
  use_amp: false

loss:
  si_snr_weight: 0.4
  mr_stft_weight: 0.3
  magnitude_weight: 0.2
  complex_weight: 0.1

data:
  train_clean_dir: "data/processed/train/clean"
  train_noisy_dir: "data/processed/train/noisy"
  val_clean_dir: "data/processed/val/clean"
  val_noisy_dir: "data/processed/val/noisy"
  test_clean_dir: "data/processed/test/clean"
  test_noisy_dir: "data/processed/test/noisy"
  num_workers: 0
  pin_memory: false

mixing:
  snr_range: [-5, 20]
  snr_levels: [-5, 0, 5, 10, 15, 20]
  dynamic_mixing: false

logging:
  log_dir: "logs/quick"
  checkpoint_dir: "checkpoints/quick"
  save_every: 1
  log_interval: 10
  tensorboard: false
